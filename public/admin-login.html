<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login – Mahajak WiFi Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b2e;--navy-mid:#162640;--navy-light:#1e3455;--gold:#c9a84c;--gold-light:#e2c97e;--gold-pale:#f5e9c8;--white:#fdfaf4;--text-muted:#8a9bb5}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(201,168,76,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,0.04) 1px,transparent 1px);background-size:48px 48px;animation:gridDrift 20s linear infinite}
@keyframes gridDrift{from{transform:translate(0,0)}to{transform:translate(48px,48px)}}
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.12;pointer-events:none}
.orb-1{width:500px;height:500px;background:var(--gold);top:-150px;right:-100px;animation:float1 12s ease-in-out infinite}
.orb-2{width:350px;height:350px;background:var(--gold-light);bottom:-100px;left:-80px;animation:float2 15s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,40px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-30px)}}
.login-card{position:relative;width:420px;background:rgba(22,38,64,0.85);border:1px solid rgba(201,168,76,0.2);border-radius:4px;padding:48px 40px 44px;backdrop-filter:blur(20px);box-shadow:0 32px 80px rgba(0,0,0,0.5),0 0 0 1px rgba(201,168,76,0.05) inset;animation:cardIn 0.7s cubic-bezier(0.16,1,0.3,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(0.97)}to{opacity:1;transform:none}}
.login-card::before{content:'';position:absolute;top:0;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);border-radius:0 0 4px 4px}
.logo-area{text-align:center;margin-bottom:36px}
.logo-emblem{width:64px;height:64px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 0 0 8px rgba(201,168,76,0.08),0 8px 24px rgba(201,168,76,0.25)}
.logo-emblem svg{width:32px;height:32px;fill:var(--navy)}
.logo-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--gold-light);letter-spacing:0.5px}
.logo-sub{font-size:11px;font-weight:300;color:var(--text-muted);letter-spacing:2.5px;text-transform:uppercase;margin-top:4px}
.divider{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.divider-line{flex:1;height:1px;background:rgba(201,168,76,0.15)}
.divider-text{font-size:10px;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase}
.field{margin-bottom:18px}
label{display:block;font-size:11px;font-weight:500;color:var(--text-muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
input[type=text],input[type=password]{width:100%;background:rgba(13,27,46,0.6);border:1px solid rgba(201,168,76,0.15);border-radius:3px;padding:12px 16px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--white);outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
input::placeholder{color:rgba(138,155,181,0.5)}
input:focus{border-color:rgba(201,168,76,0.5);background:rgba(13,27,46,0.9);box-shadow:0 0 0 3px rgba(201,168,76,0.08)}
.password-wrap{position:relative}
.toggle-pw{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;transition:color .2s}
.toggle-pw:hover{color:var(--gold)}
.btn-login{width:100%;margin-top:8px;padding:14px;background:linear-gradient(135deg,var(--gold) 0%,var(--gold-light) 50%,var(--gold) 100%);background-size:200% auto;border:none;border-radius:3px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--navy);cursor:pointer;transition:background-position .4s,box-shadow .2s,transform .15s;position:relative;overflow:hidden}
.btn-login:hover{background-position:right center;box-shadow:0 8px 24px rgba(201,168,76,0.35);transform:translateY(-1px)}
.btn-login:active{transform:translateY(0)}
.btn-login.loading{opacity:.7;pointer-events:none}
.btn-login.loading::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 30%,rgba(255,255,255,0.2) 50%,transparent 70%);animation:shimmer 1s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.error-msg{margin-top:14px;padding:10px 14px;background:rgba(220,53,69,0.12);border:1px solid rgba(220,53,69,0.25);border-radius:3px;font-size:13px;color:#ff8088;text-align:center;display:none;animation:shake .3s ease}
.error-msg.show{display:block}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.footer-note{text-align:center;margin-top:28px;font-size:11px;color:rgba(138,155,181,0.45);letter-spacing:0.5px}
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="login-card">
  <div class="logo-area">
    <div class="logo-emblem">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16 2L4 8v8c0 7.18 5.16 13.9 12 15.47C22.84 29.9 28 23.18 28 16V8L16 2z"/></svg>
    </div>
    <div class="logo-title">Mahajak WiFi Portal</div>
    <div class="logo-sub">Admin Control Panel</div>
  </div>
  <div class="divider"><div class="divider-line"></div><div class="divider-text">เข้าสู่ระบบ</div><div class="divider-line"></div></div>
  <form id="loginForm" autocomplete="off">
    <div class="field">
      <label for="username">ชื่อผู้ใช้</label>
      <input type="text" id="username" name="username" placeholder="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">รหัสผ่าน</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" class="toggle-pw" id="togglePw" aria-label="แสดง/ซ่อนรหัสผ่าน">
          <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="btn-login" id="loginBtn">เข้าสู่ระบบ</button>
    <div class="error-msg" id="errorMsg"></div>
  </form>
  <div class="footer-note">Mahajak Development Co., Ltd. &copy; 2024</div>
</div>
<script>
document.getElementById('togglePw').addEventListener('click',function(){
  const pw=document.getElementById('password');const icon=document.getElementById('eyeIcon');
  if(pw.type==='password'){pw.type='text';icon.innerHTML='<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';}
  else{pw.type='password';icon.innerHTML='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';}
});
document.getElementById('loginForm').addEventListener('submit',async function(e){
  e.preventDefault();const btn=document.getElementById('loginBtn');const err=document.getElementById('errorMsg');
  btn.classList.add('loading');btn.textContent='กำลังเข้าสู่ระบบ...';err.classList.remove('show');
  try{
    const res=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});
    const data=await res.json();
    if(data.success){btn.textContent='✓ สำเร็จ';setTimeout(()=>window.location.href=data.redirect||'/admin',400);}
    else{err.textContent=data.message||'เกิดข้อผิดพลาด';err.classList.add('show');btn.classList.remove('loading');btn.textContent='เข้าสู่ระบบ';}
  }catch(ex){err.textContent='ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้';err.classList.add('show');btn.classList.remove('loading');btn.textContent='เข้าสู่ระบบ';}
});
</script>
</body>
</html>
